<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天気予報</title>
<link rel="stylesheet" href="tenki_final.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🌤️ 天気予報</h1>
      <p id="clock" class="clock">--:--:--</p>
    </header>

    <!-- 地点管理 -->
    <section class="locations">
      <div class="location-buttons" id="location-buttons">
        <!-- JavaScript が地点ボタンを並べます -->
      </div>

      <details class="add-form">
        <summary>＋ 地点を検索して追加</summary>
        <form id="add-location-form">
          <input type="text" id="location-input" placeholder="地名を入力（例: 大阪）" autocomplete="off">
          <button type="submit">検索</button>
        </form>
        <ul id="search-results" class="search-results"></ul>
      </details>

      <button id="geolocation-btn" class="geo-btn" type="button">📍 現在地の天気を表示</button>

      <p id="status-message" class="status-message" role="status"></p>
    </section>

    <!-- 現在の天気 -->
    <section class="current" id="current">
      <p class="location-name" id="current-name">--</p>
      <p class="current-emoji" id="current-emoji">⏳</p>
      <p class="current-temp" id="current-temp">--℃</p>
      <p class="current-desc" id="current-desc">読み込み中...</p>
    </section>

    <!-- 3日間の予報 -->
    <section class="forecast">
      <h2>今日・明日・明後日の予報</h2>
      <div class="forecast-list" id="forecast-list"></div>
    </section>

    <nav class="page-nav">
      <a href="tenki_hourly.html">24時間天気を見る &rarr;</a>
    </nav>

    <footer class="app-footer">
      <p>気象データ: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> /
         地点検索: <a href="https://nominatim.openstreetmap.org/" target="_blank" rel="noopener">OpenStreetMap Nominatim</a></p>
    </footer>
  </div>

  <script src="weather-common.js"></script>
  <script src="tenki_final.js"></script>
</body>
</html>

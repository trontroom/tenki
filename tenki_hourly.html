<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24時間天気 | 天気予報</title>
<link rel="stylesheet" href="tenki_final.css">
</head>
<body>
  <header class="app-header">
    <h1>24時間天気</h1>
    <p id="location-name" class="clock" style="font-size:1.2rem;"></p>
  </header>

  <p id="status-message" class="status-message" role="status" style="text-align:center;"></p>

  <div class="hourly-table-wrap">
    <table class="hourly-table">
      <thead>
        <tr>
          <th>時刻</th>
          <th>天気</th>
          <th>気温</th>
          <th>降水量</th>
          <th>降水確率</th>
        </tr>
      </thead>
      <tbody id="hourly-body"></tbody>
    </table>
  </div>

  <nav class="page-nav">
    <a href="tenki_final.html">&larr; 天気予報トップに戻る</a>
  </nav>

  <footer class="app-footer">
    <p>気象データ: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
  </footer>

  <script src="weather-common.js"></script>
  <script src="tenki_hourly.js"></script>
</body>
</html>
